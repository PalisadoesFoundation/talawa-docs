name: Update Stable CSS

on:
  push:
    branches:
      - develop

jobs:
  update-css:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm i

      - name: Build Docusaurus site
        run: npm run build

      - name: Copy hashed CSS to static folder
        run: |
          mkdir -p static/css
          HASHED_CSS=$(ls build/assets/css/styles.*.css | head -n 1)
          echo "Found hashed CSS: $HASHED_CSS"
          cp "$HASHED_CSS" static/css/styles-latest.css
