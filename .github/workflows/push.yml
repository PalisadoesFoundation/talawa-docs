name: Update Stable CSS

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop  

jobs:
  update-css:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm i

      - name: Build Docusaurus site
        run: npm run build

      - name: Copy hashed CSS to static folder
        run: |
          mkdir -p static/css
          HASHED_CSS=$(ls build/assets/css/styles.*.css | head -n 1)
          echo "Found hashed CSS: $HASHED_CSS"
          cp "$HASHED_CSS" static/css/styles-latest.css

      - name: Commit updated stable CSS
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/css/styles-latest.css
          if git diff --cached --quiet; then
            echo "No changes in CSS"
            exit 0
          fi
          git commit -m "Update stable CSS"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git push origin HEAD:${{ github.ref_name }}


