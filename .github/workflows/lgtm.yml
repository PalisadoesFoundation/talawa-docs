name: Add LGTM Tag on All Checks Passing

on:
  workflow_run:
    workflows: ["Checking workflow files"]   
    types: [completed]

jobs:
  add-lgtm:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v6
        with:
          script: |
            const pull_requests = github.event.workflow_run.pull_requests;
            if (!pull_requests || pull_requests.length === 0) {
              core.setFailed("No pull request found.");
            }
            return core.setOutput("number", pull_requests[0].number);

      # Always remove LGTM first (ensures clean state)
      - name: Remove LGTM label
        uses: actions/github-script@v6
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ steps.pr.outputs.number }},
                name: "LGTM"
              });
            } catch (e) {
              console.log("LGTM not present -> skip");
            }

      # Add LGTM only if the entire CI succeeded
      - name: Add LGTM label if CI successful
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              labels: ["LGTM"]
            });
