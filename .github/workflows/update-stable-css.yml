name: Update Stable CSS

on:
  push:
    branches:
      - develop
  pull-request:
    branches:
      - develop  

jobs:
  update-css:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build

      - name: Copy hashed CSS to static folder
        run: |
          HASHED_CSS=$(ls build/assets/css/styles.*.css | head -n 1)
          echo "Found hashed CSS: $HASHED_CSS"
          cp "$HASHED_CSS" static/css/styles-latest.css

      - name: Commit updated stable CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/css/styles-latest.css
          git diff --quiet && echo "No changes in CSS" || git commit -m "Update stable CSS"
          git push
