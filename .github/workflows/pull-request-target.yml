  Remove-LGTM-Label:
    runs-on: ubuntu-latest
    if: always()   # always remove label first for every PR update
    steps:
      - name: Remove LGTM label immediately
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'LGTM'
              });
              console.log(`PR# ${context.issue.number} | Run ${context.runId} | Removed 'LGTM' label`);
            } catch (error) {
              console.log(`PR# ${context.issue.number} | Run ${context.runId} | LGTM not present, skipping removal.`);
            }

  Add-LGTM-Label:
    runs-on: ubuntu-latest
    needs: [Remove-LGTM-Label, Test-Docusaurus-Deployment]
    if: ${{ github.event.pull_request.merged != true }}
    steps:
      - name: Check CI results and add LGTM label only if all checks passed
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.issue.number;
            const sha = context.payload.pull_request.head.sha;

            // Get commit status
            const status = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
            const statusesPassed = status.data.state === 'success';

            // Get check runs
            const checks = await github.rest.checks.listForRef({ owner, repo, ref: sha });
            const checkRunsPassed =
              checks.data.total_count > 0 &&
              checks.data.check_runs.every(run => run.conclusion === 'success');

            if (!statusesPassed || !checkRunsPassed) {
              console.log(`Tests not finished or failing — Skipping LGTM for PR#${pr}`);
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr,
              labels: ['LGTM']
            });

            console.log(`PR#${pr} | All tests passed | LGTM label added`);
