name: PR Target Workflow
on:
  pull_request_target:

# Required for arkid15r/check-pr-issue-action
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  PR-Greeting:
    name: Pull Request Greeting
    runs-on: ubuntu-latest
    steps:
      - name: Add the PR Review Policy
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: pr_review_policy
          message: |
            ## Our Pull Request Approval Process

            This PR will be reviewed according to the [Palisadoes Contributing Guidelines](https://developer.palisadoes.org/docs/contributor-guide/contributing) 

            Thanks for contributing!

  Remove-LGTM-Label:
    runs-on: ubuntu-latest
    if: always()   # always remove label first for every PR update
    steps:
      - name: Remove LGTM label immediately
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'LGTM'
              });
              console.log(`PR# ${context.issue.number} | Run ${context.runId} | Removed 'LGTM' label`);
            } catch (error) {
              console.log(`PR# ${context.issue.number} | Run ${context.runId} | LGTM not present, skipping removal.`);
            }

  Add-LGTM-Label:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Add LGTM label
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = github.event.workflow_run.pull_requests[0]?.number;
            if (!prNumber) {
              console.log("No PR associated, skipping LGTM label.");
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['LGTM']
            });
            console.log(`PR#${prNumber} | LGTM label added`);

